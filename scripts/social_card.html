<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 675px; }
  body { background: #f6f1ea; font-family: "Noto Sans", "DejaVu Sans", sans-serif; color: #2a2420; position: relative; overflow: hidden; }
  .left { position: absolute; left: 70px; top: 70px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 96px; height: 96px; }
  h1 { font-size: 84px; margin: 0; letter-spacing: -2px; }
  p.tag { font-size: 34px; line-height: 1.3; margin: 34px 0 0; color: #4a3f36; }
  p.num { font-size: 27px; line-height: 1.35; margin: 36px 0 0; padding-top: 24px; border-top: 3px solid #d4691f; color: #2a2420; }
  p.num b { color: #b4540f; }
  .right { position: absolute; right: 60px; top: 80px; width: 480px; }
  .frame { position: relative; width: 480px; height: 515px; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 40px rgba(42,36,32,.28); }
  .frame img { position: absolute; top: 0; height: 515px; width: 686px; object-fit: cover; left: 0; }
  .frame .after { clip-path: inset(0 0 0 50%); }
  .frame .line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #fffaf0; margin-left: -2px; }
  .label { position: absolute; top: 14px; font-size: 20px; padding: 4px 12px; border-radius: 8px; background: rgba(42,36,32,.78); color: #fff6e6; }
</style>
<div class="left">
  <div class="brand"><img src="../assets/logo.svg" alt=""><h1>Unfaded</h1></div>
  <p class="tag">Restore old family photos on your own GPU and see what every step changed.</p>
  <p class="num">Finds <b>12 of 12</b> prints on synthetic scans and adds <b>+2.2 dB</b> PSNR on known scratch damage.</p>
</div>
<div class="right">
  <div class="frame">
    <img class="before" src="../assets/creased-before.jpg" alt="">
    <img class="after" src="../assets/creased-after.jpg" alt="">
    <div class="line"></div>
    <span class="label" style="left:14px">Before</span>
    <span class="label" style="right:14px">After</span>
  </div>
</div>
