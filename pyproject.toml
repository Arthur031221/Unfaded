[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unfaded"
dynamic = ["version"]
description = "Restore old family photos on your own GPU, and see exactly what every step changed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Arthur031221" }]
keywords = ["photo-restoration", "old-photos", "gfpgan", "real-esrgan", "lama", "ddcolor", "scan", "genealogy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
unfaded = "unfaded.cli:main"

[project.urls]
Homepage = "https://github.com/Arthur031221/Unfaded"
Demo = "https://arthur031221.github.io/Unfaded/"
Issues = "https://github.com/Arthur031221/Unfaded/issues"

[tool.hatch.version]
path = "src/unfaded/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unfaded"]

[tool.hatch.build.targets.sdist]
include = ["src/unfaded", "tests", "docs", "README*.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs the model weights in the cache (run `unfaded models --fetch`)",
  "browser: needs Playwright and Chromium",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/unfaded/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
